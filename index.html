<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>The Odin Calculator</title>
</head>

<body>
    <main>
        <h2>Do your calculation:</h2>
        <div class="display-container">
            <input disabled/>
            <p class="answer"></p>
        </div>
        <div class="input-button">
            <div class="operators">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>+</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>-</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>*</button>
                <button>0</button>
                <button>00</button>
                <button>.</button>
                <button>/</button>
            </div>
            <div class="operation">
                <button id="clear">Clear</button>
                <button id="delete">D</button>
                <button id="calculate">=</button>
            </div>
        </div>
    </main>
    <script src="calc.js"></script>
</body>

</html>
